<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copy as Markdown</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="meta">
        <h1 id="page-title">Copy as Markdown</h1>
        <a id="page-url" target="_blank" rel="noreferrer"></a>
      </div>
      <div class="controls">
        <div class="segmented" role="tablist" aria-label="View mode">
          <button id="tab-preview" role="tab" aria-selected="true">Preview</button>
          <button id="tab-markdown" role="tab" aria-selected="false">Markdown</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="frontmatter" />
          Frontmatter
        </label>
        <button id="copy" class="btn primary">Copy</button>
        <button id="download" class="btn">Save .md</button>
      </div>
    </header>
    <main>
      <p id="empty" hidden>
        No content found. Click the extension icon on a page to capture it.
      </p>
      <article id="preview" class="pane"></article>
      <textarea id="editor" class="pane" spellcheck="false" hidden></textarea>
    </main>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
